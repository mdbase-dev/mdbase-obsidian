name: Promote plugin release

# The newest published prerelease becomes the full, latest release once no
# commit has landed on main for three hours (scripts/plugin-release.mjs).
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Not the publisher's group: a queued run there would replace a pending publication.
concurrency:
  group: plugin-promote
  cancel-in-progress: false

jobs:
  promote:
    name: Promote quiet prerelease
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Mint the release automation App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          package-manager-cache: false
      - name: Promote the newest prerelease after three quiet hours
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: node scripts/plugin-release.mjs promote
