name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    name: Obsidian plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint Obsidian plugin
        run: npm run lint
      - name: Test
        run: npm test
      - name: Test release automation
        run: npm run test:release
      - name: Build and validate mobile bundle
        run: npm run check:mobile
      - name: Validate release assets
        run: >-
          node -e "const fs=require('node:fs'); for (const file of
          ['main.js','manifest.json','styles.css']) { if
          (!fs.existsSync(file) || fs.statSync(file).size === 0) throw new
          Error('Missing or empty release asset: '+file); }"
      - name: Upload plugin assets
        uses: actions/upload-artifact@v4
        with:
          name: mdbase-obsidian-${{ github.sha }}
          if-no-files-found: error
          path: |
            main.js
            manifest.json
            styles.css

  release:
    name: Publish plugin prerelease
    needs: plugin
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: plugin-release
      cancel-in-progress: false
    steps:
      - name: Mint the release automation App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          package-manager-cache: false
      - name: Resolve new publication or resume the original tag
        id: target
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          cp scripts/plugin-release.mjs "$RUNNER_TEMP/plugin-release.mjs"
          node "$RUNNER_TEMP/plugin-release.mjs" target
      - name: Download this build's validated assets
        if: steps.target.outputs.ref == github.sha
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mdbase-obsidian-${{ github.sha }}
      - name: Checkout the original tag for interrupted publication
        if: steps.target.outputs.ref != '' && steps.target.outputs.ref != github.sha
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - name: Rebuild and validate original tagged assets
        if: steps.target.outputs.ref != '' && steps.target.outputs.ref != github.sha
        run: |
          npm ci
          npm run lint
          npm test
          npm run test:release
          npm run check:mobile
      - name: Publish or repair complete prerelease
        if: steps.target.outputs.ref != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          RELEASE_SHA: ${{ steps.target.outputs.ref }}
        run: node "$RUNNER_TEMP/plugin-release.mjs"
