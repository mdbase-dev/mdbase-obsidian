name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    name: Obsidian plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint Obsidian plugin
        run: npm run lint
      - name: Test
        run: npm test
      - name: Test release automation
        run: npm run test:release
      - name: Build and validate mobile bundle
        run: npm run check:mobile
      - name: Validate release assets
        run: >-
          node -e "const fs=require('node:fs'); for (const file of
          ['main.js','manifest.json','styles.css']) { if
          (!fs.existsSync(file) || fs.statSync(file).size === 0) throw new
          Error('Missing or empty release asset: '+file); }"
      - name: Upload plugin assets
        uses: actions/upload-artifact@v4
        with:
          name: mdbase-obsidian-${{ github.sha }}
          if-no-files-found: error
          path: |
            main.js
            manifest.json
            styles.css

  release:
    name: Prepare or publish plugin release
    needs: plugin
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: plugin-release
      cancel-in-progress: false
    steps:
      - name: Mint the release automation App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Download this build's validated assets
        uses: actions/download-artifact@v4
        with:
          name: mdbase-obsidian-${{ github.sha }}
      - name: Prepare version PR or publish complete release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: node scripts/plugin-release.mjs
